<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Library{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #17365d;
            color: white;
            padding: 22px 8%;
        }

        header h2 {
            margin: 0;
        }

        nav {
            margin-top: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        main {
            padding: 25px 5%;
            min-height: 70vh;
        }

        footer {
            background: #17365d;
            color: white;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>
    <header>
        <h2>📚 My Library</h2>
        <nav>
            <a href="/books/">Home</a>
            <a href="/books/add/">Add Book</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        © 2026 My Library
    </footer>
</body>
</html>
